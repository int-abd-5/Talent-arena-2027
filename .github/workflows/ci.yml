# Runs on synthetic inputs. Real competition assets and the organizer scoreboard stay local.
name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make check
      - run: make audit
