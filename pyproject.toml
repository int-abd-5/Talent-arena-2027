[project]
name = "mtah2027-possession"
version = "0.1.0"
description = "Team possession estimation from tactical football tracking"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.2,<3"]

[dependency-groups]
dev = [
    "mypy>=1.15,<3",
    "pandas>=2.2,<4",
    "pip-audit>=2.9,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["app/tools", "app/tests"]
addopts = "--strict-markers"
